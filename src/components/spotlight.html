<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Spotlight</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white">
    <!-- section1 - In the Spotlight -->
    <section class="mb-6">
        <h2 class="text-xl sm:text-2xl font-bold mb-3">
            In The Spotlight
        </h2>

        <!-- Horizontal Banner List -->
        <div class="flex gap-3 sm:gap-5 overflow-x-auto scrollbar-hide snap-x snap-mandatory">

            <!-- banner1 -->
            <div
                class="flex-none w-[220px] sm:w-[235px] aspect-[1.4/1] rounded-2xl overflow-hidden snap-start relative">
                <img src="assets/promotion/banner/spolight/spotlight1.webp" class="w-full h-full object-cover"
                    alt="Dr Morepen">
                <span class="absolute bottom-0 left-0 w-full bg-yellow-200
                                 text-black text-xs font-bold p-2">
                    From ₹939*
                </span>
            </div>

            <!-- banner2 -->
            <div class="flex-none w-55 sm:w-58.75 aspect-[1.4/1] rounded-2xl overflow-hidden snap-start relative">
                <img src="assets/promotion/banner/spolight/spotlight2.webp" class="w-full h-full object-cover"
                    alt="Fire Boltt">
                <span class="absolute bottom-0 left-0 w-full bg-yellow-200 text-black text-xs font-bold p-2">
                    Just ₹1,899
                </span>
            </div>

            <!-- banner3 -->
            <div class="flex-none w-55 sm:w-58.75 aspect-[1.4/1] rounded-2xl overflow-hidden snap-start relative">
                <img src="assets/promotion/banner/spolight/spotlight3.webp" class="w-full h-full object-cover "
                    alt="HMD Vibe">
                <span class="w-full absolute bottom-0 left-0 bg-yellow-200 text-black text-xs font-bold p-2">
                    From ₹12,999*
                </span>
            </div>


            <!-- Banner 4 -->
            <div class="flex-none w-[220px] sm:w-[235px] aspect-[1.4/1]
                            rounded-2xl overflow-hidden snap-start relative">

                <img src="assets/promotion/banner/spolight/spotlight4.webp" class="w-full h-full object-cover"
                    alt="Mivi One">

                <span class="absolute bottom-0 left-0 w-full bg-yellow-200
                                 text-black text-xs font-bold p-2">
                    From ₹11,999*
                </span>
            </div>

            <!-- Banner 5 -->
            <div class="flex-none w-[220px] sm:w-[235px] aspect-[1.4/1]
                            rounded-2xl overflow-hidden snap-start relative">

                <img src="assets/promotion/banner/spolight/spotlight5.webp" class="w-full h-full object-cover"
                    alt="Ecowacs">

                <span class="absolute bottom-0 left-0 w-full bg-yellow-200
                                 text-black text-xs font-bold p-2">
                    Up to 50% Off
                </span>
            </div>

            <!-- Banner 6 -->
            <div class="flex-none w-[220px] sm:w-[235px] aspect-[1.4/1]
                            rounded-2xl overflow-hidden snap-start relative">

                <img src="assets/promotion/banner/spolight/spotlight6.webp" class="w-full h-full object-cover"
                    alt="Ecowacs">

                <span class="absolute bottom-0 left-0 w-full bg-yellow-200
                                 text-black text-xs font-bold p-2">
                    Up to 50% Off
                </span>
            </div>

        </div>



    </section>

    <!-- ================= IN DEMAND / TRENDS ================= -->

    <section class="mt-5 bg-orange-500 rounded-2xl overflow-hidden md:bg-amber-500 p-2 sm:p-3">

        <!-- section title -->
        <h2 class="text-xl sm:text-2xl font-bold text-white px-2 py-2">
            <span class="hidden md:block">
                In demand
            </span>
            <span class="md:hidden">
                Trends you may like
            </span>
        </h2>

        <!-- Product Grid -->
        <div class="bg-white rounded-xl p-2 sm:p-3">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 sm:gap-3">

                <!-- Product1 -->
                <a href="">
                    <div class="bg-gray-100 rounded-lg overflow-hidden">
                        <img src="assets/promotion/products/drone.jpeg"
                            class="w-full h-40 sm:h-48 object-contain md:46.75">

                    </div>

                    <div class="py-2">
                        <p class="text-sm sm:text-base">
                            Top Picks
                        </p>
                        <p class="text-sm sm:text-base font-bold">
                            Under ₹199
                        </p>
                    </div>
                </a>

                <!-- Product 2 -->
                <a href="products.html" class="min-w-0">
                    <div class="bg-gray-100 rounded-lg overflow-hidden">
                        <img src="assets/promotion/products/tshirt.jpeg"
                            class="w-full h-40 sm:h-48 md:h-[187px] object-contain" alt="T-shirts">
                    </div>

                    <div class="py-2">
                        <p class="text-sm sm:text-base">New Collection</p>
                        <p class="text-sm sm:text-base font-bold">Min. 80% Off</p>
                    </div>
                </a>

                <!-- Product 3 -->
                <a href="products.html" class="min-w-0">
                    <div class="bg-gray-100 rounded-lg overflow-hidden">
                        <img src="assets/promotion/products/dry-fruits.jpeg"
                            class="w-full h-40 sm:h-48 md:h-[187px] object-contain" alt="Dry Fruits">
                    </div>

                    <div class="py-2">
                        <p class="text-sm sm:text-base">In Focus Now</p>
                        <p class="text-sm sm:text-base font-bold">Top Rated</p>
                    </div>
                </a>

                <!-- Product 4 -->
                <a href="products.html" class="min-w-0">
                    <div class="bg-gray-100 rounded-lg overflow-hidden">
                        <img src="assets/promotion/products/dress.jpeg"
                            class="w-full h-40 sm:h-48 md:h-[187px] object-contain" alt="Dress">
                    </div>

                    <div class="py-2">
                        <p class="text-sm sm:text-base">Top Sellers</p>
                        <p class="text-sm sm:text-base font-bold">Top Rated</p>
                    </div>
                </a>



            </div>
        </div>

    </section>

</body>

</html>
