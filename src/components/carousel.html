<!-- Reusable Carousel -->
<div class="w-full overflow-hidden px-3 sm:px-5">

    <div class="relative w-full mx-auto">

        <!-- Dynamic Slides -->
        <div id="promoCarousel"
            class="flex gap-3 sm:gap-5 lg:gap-10 overflow-x-auto scroll-smooth snap-x snap-mandatory scrollbar-hide">
        </div>

        <!-- Previous Button -->
        <button id="promoPrev"
            class="absolute left-2 top-1/2 -translate-y-1/2 z-10 bg-white/90 hover:bg-white shadow-lg rounded-full w-9 h-9 sm:w-11 sm:h-11 flex items-center justify-center">
            &#10094;
        </button>

        <!-- Next Button -->
        <button id="promoNext"
            class="absolute right-2 top-1/2 -translate-y-1/2 z-10 bg-white/90 hover:bg-white shadow-lg rounded-full w-9 h-9 sm:w-11 sm:h-11 flex items-center justify-center">
            &#10095;
        </button>

        <!-- Pagination -->
        <div id="promoDots" class="flex justify-center items-center gap-2 py-4 min-h-[30px]">
        </div>

    </div>
</div>
