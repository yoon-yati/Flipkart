<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flipkart</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Flowbite CSS -->
    <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet">

    <!-- Lucide -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

</head>

<body class="bg-white">

    </header>

    <!-- Dynamic Page -->
    <main id="page-content" class="mx-auto max-w-7xl p-5">

    <!-- Flowbite JS -->

    <script src="js/data/promo-data.js"></script>

    <script src="js/pages/toy.js"></script>
    <script src="js/pages/food.js"></script>
    <script src="js/pages/accessorie.js"></script>
    <script src="js/pages/sport.js"></script>
    <script src="js/pages/furniture.js"></script>
    <script src="js/pages/book.js"></script>
    <script src="js/pages/wheel..js"></script>

    <!-- Main Controller (Always Last) -->
    <script src="js/layout.js"></script>

</body>

</html>
