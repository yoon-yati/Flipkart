<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Flipkart Header</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Flowbite -->
    <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" />

</head>


<body class="bg-gray-100">
    <header class="w-full bg-white">

        <div class="mx-auto w-full max-w-screen-2xl px-3 sm:px-6 lg:px-10">

            <!-- FIRST SECTION: Logo and Delivery -->
            <div class="flex flex-col gap-3 py-3 sm:flex-row sm:items-center sm:justify-between">

                <!-- Logos -->
                <div class="flex justify-center items-center gap-3 sm:gap-5">

                    <div class="flex items-center gap-2 rounded-xl bg-[#ffe51e] px-4 py-3">
                        <img src="assets/logo/flipkart.png" class="h-5 w-6 object-contain" alt="Logo">

                        <img src="assets/logo/flipkart2.png" class="h-4 w-12 object-contain" alt="Flipkart">
                    </div>

                    <div class="flex items-center gap-2 rounded-xl bg-gray-100 px-4 py-3">
                        <img src="assets/logo/airplane.png" class="h-5 w-6 object-contain" alt="Travel">

                        <span class="text-sm font-medium">Travel</span>
                    </div>

                </div>

                <!-- Delivery Location -->
                <div class="flex flex-wrap items-center gap-2 text-sm">

                    <div class="flex items-center gap-1 text-gray-600">
                        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 16 16">
                            <path d="M0 0h16v16H0z" fill="none" />
                            <g fill="currentColor">
                                <path
                                    d="M10.361 10.485C11.354 10.94 12 11.672 12 12.5c0 1.38-1.79 2.5-4 2.5s-4-1.12-4-2.5c0-.828.645-1.56 1.638-2.015l.267.354c.454.593.886 1.16 1.268 1.723a1 1 0 0 0 1.654 0a39 39 0 0 1 1.268-1.723z" />
                                <path
                                    d="M8 1c2.4 0 4 1.572 4 3.929c0 2.058-1.83 4.117-3.36 6.176A26 26 0 0 0 8 12c-.418-.616-.89-1.232-1.361-1.849C5.309 8.411 4 6.67 4 4.93C4 2.572 5.6 1 8 1m0 1.964c-.53 0-1.039.208-1.414.576A1.95 1.95 0 0 0 6 4.929c0 .52.21 1.02.586 1.388c.375.369.884.576 1.414.576s1.039-.207 1.414-.576a1.94 1.94 0 0 0 0-2.776A2.02 2.02 0 0 0 8 2.964" />
                            </g>
                        </svg>

                        <span>Location not set</span>
                    </div>

                    <a href="#" class="font-medium text-blue-600">
                        Select Delivery Location &gt;
                    </a>

                </div>

            </div>
        </div>
    </header>

    <!-- Initialize Icons -->
    <script>
        lucide.createIcons();</script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>

</body>

</html>
